  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/base.css?v=202610102047">
  <link rel="stylesheet" href="css/layout.css?v=202610102047">
  <link rel="stylesheet" href="css/components.css?v=202610102047">
  <link rel="stylesheet" href="css/animations.css?v=202610102047">
  <link rel="stylesheet" href="css/pages.css?v=202610102047">
  <link rel="stylesheet" href="css/responsive.css?v=202610102047">
  <script src="js/boot.js?v=202610102047"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script type="module" src="js/main.js?v=202610102047"></script>
</head>
<body data-page="contacts">
  <main id="main" tabindex="-1">
    <section class="page-hero scene" data-scene="light">
      <div class="container">
        <nav class="breadcrumb" data-i18n-attr="aria-label:nav.breadcrumb"><ol><li><a href="index.html" data-i18n="nav.home"></a></li><li aria-current="page" data-i18n="nav.contacts"></li></ol></nav>
        <div class="page-hero__grid">
          <div>
            <h1 data-reveal="lines" data-i18n-html="contactsPage.title"></h1>
          </div>
          <div class="stack">
            <p class="lead" data-reveal="up" data-i18n="contactsPage.lead"></p>
            
          </div>
        </div>
      </div>
    </section>
    <section class="section scene" data-scene="light" style="padding-top:0">
      <div class="container contact-grid">
        <dl class="contact-big" data-reveal="stagger" data-contact-list></dl>
        <div class="stack" style="--stack:var(--sp-6)">
          <div class="map" data-reveal="clip" data-map></div>
          <p class="field__hint" data-i18n="contactsPage.mapNote"></p>
          <div class="dir-links" data-directions></div>
        </div>
      </div>
    </section>
    <section class="section scene" data-scene="dark">
      <div class="container split">
        <div class="split__sticky">
          <h2 data-reveal="lines" data-i18n="hours.title"></h2>
          <p class="status" data-open-status></p>
        </div>
        <div class="stack" style="--stack:var(--sp-7)">
          <table class="hours-table" data-reveal="up"><caption class="sr-only" data-i18n="hours.title"></caption><tbody data-hours-table></tbody></table>
          <div class="info-card">
            <h3 data-i18n="contactsPage.gettingHere"></h3>
            <p data-i18n="contactsPage.gettingHereText"></p>
          </div>
        </div>
      </div>
    </section>
    <section class="section section--tight scene" data-scene="light">
      <div class="container">
        <div class="cta-band" data-reveal="up">
          <h2 data-i18n-html="home.final.title"></h2>
          <div class="cta-band__actions">
            <a class="btn btn--solid" href="booking.html" ><span class="btn__label" data-text=""><span data-i18n="cta.book"></span></span><svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
            <a class="btn" href="contacts.html" ><span class="btn__label" data-text=""><span data-i18n="cta.contact"></span></span></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <noscript><p style="padding:1rem;text-align:center">Для полной работы сайта включите JavaScript.</p></noscript>
</body>
</html>
