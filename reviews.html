  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/boot.js"></script>

  <script type="module" src="js/main.js"></script>
</head>
<body data-page="reviews">
  <main id="main" tabindex="-1">
    <section class="page-hero scene" data-scene="light">
      <div class="container">
        <nav class="breadcrumb" data-i18n-attr="aria-label:nav.breadcrumb"><ol><li><a href="index.html" data-i18n="nav.home"></a></li><li aria-current="page" data-i18n="nav.reviews"></li></ol></nav>
        <div class="page-hero__grid">
          <div>
            <h1 data-reveal="lines" data-i18n-html="reviewsPage.title"></h1>
          </div>
          <div class="stack">
            <p class="lead" data-reveal="up" data-i18n="reviewsPage.lead"></p>
            
          </div>
        </div>
      </div>
    </section>
    <section class="section scene" data-scene="light" style="padding-top:0">
      <div class="container" data-reviews></div>
    </section>
    <section class="section scene" data-scene="dark">
      <div class="container split">
        <div class="split__sticky">
          <h2 data-reveal="lines" data-i18n="reviewsPage.policyTitle"></h2>
        </div>
        <ol class="steps" role="list" data-reveal="stagger" data-review-policy></ol>
      </div>
    </section>
    <section class="section scene" data-scene="light">
      <div class="container">
        <div class="cta-band" data-reveal="up">
          <div class="stack" style="--stack:var(--sp-3)">
            <h2 data-i18n="reviewsPage.leaveTitle"></h2>
            <p class="muted" data-i18n="reviewsPage.leaveText"></p>
          </div>
          <div class="cta-band__actions" data-review-platforms></div>
        </div>
      </div>
    </section>
  </main>
  <noscript><p style="padding:1rem;text-align:center">Для полной работы сайта включите JavaScript.</p></noscript>
</body>
